name: pipeline

on:
  workflow_dispatch:
    inputs:
      min_f1:
        description: "Minimum F1 to pass the gate"
        default: "0.5"

jobs:
  train:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.train.outputs.version }}
    env:
      MINIO_ENDPOINT: "10.10.0.13:9000"
      MLFLOW_TRACKING_URI: "http://10.10.0.14:5000"
      MINIO_USER: ${{ secrets.MINIO_USER }}
      MINIO_PASSWORD: ${{ secrets.MINIO_PASSWORD }}
      MIN_F1: ${{ inputs.min_f1 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -q -r training/requirements.txt

      - name: Train
        id: train
        run: |
          . .venv/bin/activate
          python training/train.py
  eval:
    needs: train
    runs-on: self-hosted
    env:
      MINIO_ENDPOINT: "10.10.0.13:9000"
      MLFLOW_TRACKING_URI: "http://10.10.0.14:5000"
      MINIO_USER: ${{ secrets.MINIO_USER }}
      MINIO_PASSWORD: ${{ secrets.MINIO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -q -r training/requirements.txt

      - name: Evaluate
        run: |
          . .venv/bin/activate
          python training/evaluate.py