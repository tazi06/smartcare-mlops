apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: risk-service
  template:
    metadata:
      labels:
        app: risk-service
    spec:
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: risk-service
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: risk-service
spec:
  type: NodePort
  selector:
    app: risk-service
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000